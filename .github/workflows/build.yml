name: Build and Release

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - '.agent/**'
  pull_request:
    branches:
      - master
      - main
      - develop
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - '.agent/**'
  # Manual trigger, so a release can be built without inventing a commit. Needed whenever a push
  # event fails to start a run — GitHub throttles webhook delivery during Actions incidents, which
  # silently drops the trigger and leaves the branch built but unreleased.
  # The build profile still comes from the ref you dispatch against: `develop` builds Alpha,
  # anything else builds Production.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    # Exposed so the Linux job attaches its artifacts to this exact release rather than
    # recomputing the tag and risking a mismatch. Additive only: no step below reads these.
    outputs:
      tag: ${{ steps.build_profile.outputs.tag_prefix }}${{ steps.version.outputs.version }}
      profile: ${{ steps.build_profile.outputs.profile }}
    # FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 was removed here: every action below now targets node24
    # natively, so it was a no-op, and keeping it would suppress the warning that announces the
    # *next* runtime deprecation instead of surfacing it.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Cache Electron
        uses: actions/cache@v6
        with:
          path: |
            ~/.electron
            node_modules/.bin/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      
      - name: Install dependencies
        shell: pwsh
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "npm ci attempt $attempt/$maxAttempts"
            npm ci --prefer-offline --no-audit
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt $maxAttempts) {
              $delay = 15 * $attempt
              Write-Host "npm ci failed, retrying in ${delay}s..."
              Start-Sleep -Seconds $delay
            }
          }
          throw "npm ci failed after $maxAttempts attempts"
      
      - name: Determine build profile
        id: build_profile
        run: |
          # On pull_request: use the PR target branch. On push and workflow_dispatch: use the ref
          # itself. Inverted from the original `event_name == 'push'` test because `github.base_ref`
          # is empty for workflow_dispatch, which would have silently built a manually dispatched
          # `develop` run with the Production profile and tagged it `v<version>`.
          $branch = "${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}"
          if ($branch -eq "develop") {
            echo "profile=alpha" >> $env:GITHUB_OUTPUT
            echo "tag_prefix=alpha-v" >> $env:GITHUB_OUTPUT
            echo "is_prerelease=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "profile=production" >> $env:GITHUB_OUTPUT
            echo "tag_prefix=v" >> $env:GITHUB_OUTPUT
            echo "is_prerelease=false" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      - name: Build application
        run: |
          if ("${{ steps.build_profile.outputs.profile }}" -eq "alpha") {
            npm run build:alpha
          } else {
            npm run build:prod
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged optimizer dependencies
        run: npm run verify:packaged-optimizer
      
      - name: Get version from package.json
        id: version
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create and push tag
        if: github.event_name != 'pull_request'
        run: |
          $tag = "${{ steps.build_profile.outputs.tag_prefix }}${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f $tag
          git push origin $tag -f
        shell: pwsh
      
      - name: Delete old release
        if: github.event_name != 'pull_request'
        run: |
          $tag = "${{ steps.build_profile.outputs.tag_prefix }}${{ steps.version.outputs.version }}"
          gh release delete $tag -y || true
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create source tarball
        if: github.event_name != 'pull_request'
        id: source_bundle
        run: |
          $tag = "${{ steps.build_profile.outputs.tag_prefix }}${{ steps.version.outputs.version }}"
          $sourceTarball = "release/onyx-source-$tag.tar.gz"
          git archive --format=tar.gz --output=$sourceTarball HEAD
          echo "source_tarball=$sourceTarball" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Prepare release notes from changelog
        if: github.event_name != 'pull_request'
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $changelog = Get-Content CHANGELOG.md -Raw

          $patternWithBrackets = "(?ms)^##\s*\[$([regex]::Escape($version))\][^\r\n]*\r?\n.*?(?=^\s*##\s|\z)"
          $patternWithoutBrackets = "(?ms)^##\s*$([regex]::Escape($version))[^\r\n]*\r?\n.*?(?=^\s*##\s|\z)"

          $match = [regex]::Match($changelog, $patternWithBrackets)
          if (-not $match.Success) {
            $match = [regex]::Match($changelog, $patternWithoutBrackets)
          }

          if ($match.Success) {
            $releaseNotes = $match.Value.Trim()
          } else {
            Write-Warning "No changelog section found for version $version. Falling back to default release notes."
            $releaseNotes = "## $version`n`nSee CHANGELOG.md for detailed release notes."
          }

          New-Item -ItemType Directory -Path release -Force | Out-Null
          Set-Content -Path release/release-notes.md -Value $releaseNotes -Encoding utf8
        shell: pwsh
      
      - name: Create Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.build_profile.outputs.tag_prefix }}${{ steps.version.outputs.version }}
          name: ${{ steps.build_profile.outputs.profile == 'alpha' && 'Onyx Alpha' || 'Onyx' }} ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.build_profile.outputs.is_prerelease }}
          body_path: release/release-notes.md
          files: |
            release/*Setup*.exe
            release/*.blockmap
            release/latest.yml
            ${{ steps.source_bundle.outputs.source_tarball }}
          draft: false
          token: ${{ secrets.GITHUB_TOKEN }}

  # Linux packaging runs as a separate job that attaches to the release the Windows job already
  # created. Deliberately structured this way rather than as a matrix: the Windows job owns the tag,
  # the release and its notes, and `needs: build` means a Linux failure can never prevent the
  # Windows installer from publishing. Assets are added with `gh release upload`, which only adds
  # files — it cannot rewrite the tag, the notes or the existing Windows assets.
  build-linux:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      # electron-builder shells out to rpmbuild for the .rpm target, which is not present on the
      # runner image. fakeroot is used by the .deb target.
      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot

      - name: Install dependencies
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          for attempt in 1 2 3; do
            echo "npm ci attempt $attempt/3"
            if npm ci --prefer-offline --no-audit; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((15 * attempt))
            fi
          done
          echo "npm ci failed after 3 attempts" >&2
          exit 1

      - name: Build Linux packages
        run: |
          if [ "${{ needs.build.outputs.profile }}" = "alpha" ]; then
            npm run build:linux:alpha
          else
            npm run build:linux
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List built artifacts
        run: ls -la release

      - name: Attach Linux artifacts to the release
        if: github.event_name != 'pull_request'
        run: |
          shopt -s nullglob
          packages=(release/*.AppImage release/*.deb release/*.rpm)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No Linux packages were produced" >&2
            exit 1
          fi

          # latest-linux.yml is electron-updater's feed for the AppImage. It is checked separately
          # and treated as fatal because without it in the release every packaged Linux build fails
          # its update check — the packages upload fine and the breakage only shows up at runtime.
          feed=(release/latest-linux.yml)
          if [ ${#feed[@]} -eq 0 ]; then
            echo "latest-linux.yml is missing; AppImage auto-update would be broken" >&2
            exit 1
          fi

          echo "Uploading: ${packages[*]} ${feed[*]}"
          gh release upload "${{ needs.build.outputs.tag }}" "${packages[@]}" "${feed[@]}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
