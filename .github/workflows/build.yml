name: Build and Release

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - 'agents.md'
      - 'brain/**'
      - '.gemini/**'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - 'agents.md'
      - 'brain/**'
      - '.gemini/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Cache Electron
        uses: actions/cache@v3
        with:
          path: |
            ~/.electron
            node_modules/.bin/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      
      - name: Install dependencies
        shell: pwsh
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "npm ci attempt $attempt/$maxAttempts"
            npm ci --prefer-offline --no-audit
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt $maxAttempts) {
              $delay = 15 * $attempt
              Write-Host "npm ci failed, retrying in ${delay}s..."
              Start-Sleep -Seconds $delay
            }
          }
          throw "npm ci failed after $maxAttempts attempts"
      
      - name: Determine build profile
        id: build_profile
        run: |
          # On push: use current branch; on pull_request: use PR target branch
          $branch = "${{ github.event_name == 'push' && github.ref_name || github.base_ref }}"
          if ($branch -eq "develop") {
            echo "profile=alpha" >> $env:GITHUB_OUTPUT
            echo "tag_prefix=alpha-v" >> $env:GITHUB_OUTPUT
            echo "is_prerelease=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "profile=production" >> $env:GITHUB_OUTPUT
            echo "tag_prefix=v" >> $env:GITHUB_OUTPUT
            echo "is_prerelease=false" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      - name: Install pnpm (for electron-builder)
        shell: pwsh
        run: npm install -g pnpm

      - name: Build application
        run: |
          if ("${{ steps.build_profile.outputs.profile }}" -eq "alpha") {
            npm run build:alpha
          } else {
            npm run build:prod
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged optimizer dependencies
        run: npm run verify:packaged-optimizer
      
      - name: Get version from package.json
        id: version
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create and push tag
        if: github.event_name == 'push'
        run: |
          $tag = "${{ steps.build_profile.outputs.tag_prefix }}${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f $tag
          git push origin $tag -f
        shell: pwsh
      
      - name: Delete old release
        if: github.event_name == 'push'
        run: |
          $tag = "${{ steps.build_profile.outputs.tag_prefix }}${{ steps.version.outputs.version }}"
          gh release delete $tag -y || true
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create source tarball
        if: github.event_name == 'push'
        id: source_bundle
        run: |
          $tag = "${{ steps.build_profile.outputs.tag_prefix }}${{ steps.version.outputs.version }}"
          $sourceTarball = "release/onyx-source-$tag.tar.gz"
          git archive --format=tar.gz --output=$sourceTarball HEAD
          echo "source_tarball=$sourceTarball" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Prepare release notes from changelog
        if: github.event_name == 'push'
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $changelog = Get-Content CHANGELOG.md -Raw

          $patternWithBrackets = "(?ms)^##\s*\[$([regex]::Escape($version))\][^\r\n]*\r?\n.*?(?=^\s*##\s|\z)"
          $patternWithoutBrackets = "(?ms)^##\s*$([regex]::Escape($version))[^\r\n]*\r?\n.*?(?=^\s*##\s|\z)"

          $match = [regex]::Match($changelog, $patternWithBrackets)
          if (-not $match.Success) {
            $match = [regex]::Match($changelog, $patternWithoutBrackets)
          }

          if ($match.Success) {
            $releaseNotes = $match.Value.Trim()
          } else {
            Write-Warning "No changelog section found for version $version. Falling back to default release notes."
            $releaseNotes = "## $version`n`nSee CHANGELOG.md for detailed release notes."
          }

          New-Item -ItemType Directory -Path release -Force | Out-Null
          Set-Content -Path release/release-notes.md -Value $releaseNotes -Encoding utf8
        shell: pwsh
      
      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.build_profile.outputs.tag_prefix }}${{ steps.version.outputs.version }}
          name: ${{ steps.build_profile.outputs.profile == 'alpha' && 'Onyx Alpha' || 'Onyx' }} ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.build_profile.outputs.is_prerelease }}
          body_path: release/release-notes.md
          files: |
            release/*Setup*.exe
            release/*.blockmap
            release/latest.yml
            ${{ steps.source_bundle.outputs.source_tarball }}
          draft: false
          token: ${{ secrets.GITHUB_TOKEN }}
