name: Suspend Service Mock Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ master, develop, main ]
    paths-ignore:
      - 'docs/**'
      - '.github/**'
      - '*.md'
  push:
    branches: [ master, develop, main, fix/**, feature/** ]
    paths-ignore:
      - 'docs/**'
      - '.github/**'
      - '*.md'


jobs:
  suspend-mock:
    name: Suspend Service Mock Tests (Linux)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        shell: pwsh
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "npm ci attempt $attempt/$maxAttempts"
            npm ci --prefer-offline --no-audit
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt $maxAttempts) {
              $delay = 15 * $attempt
              Write-Host "npm ci failed, retrying in ${delay}s..."
              Start-Sleep -Seconds $delay
            }
          }
          throw "npm ci failed after $maxAttempts attempts"

      - name: Run suspend service mock tests
        run: npm run test:suspend:service-mock
        env:
          CI: true
